name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - work

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  phase-tests:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run phase 5 tests
        run: npm run test:phase5
        env:
          NODE_ENV: test
      - name: Run phase 6 tests
        run: npm run test:phase6
        env:
          NODE_ENV: test
      - name: Run phase 9 tests
        run: npm run test:phase9
        env:
          NODE_ENV: test
