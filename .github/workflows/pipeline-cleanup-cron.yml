name: Pipeline Cleanup Cron

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  trigger-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/cron/pipeline-cleanup
        env:
          CRON_URL: ${{ secrets.CRON_PIPELINE_CLEANUP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_URL" ]; then
            echo "CRON_PIPELINE_CLEANUP_URL is not set"
            exit 1
          fi

          http_code=$(curl -sS -o response.json -w "%{http_code}" \
            --request GET \
            --url "$CRON_URL" \
            --header "Authorization: Bearer $CRON_SECRET")

          echo "HTTP status: $http_code"
          cat response.json

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            exit 1
          fi
